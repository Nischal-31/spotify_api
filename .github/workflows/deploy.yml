name: Deploy Spotify API to EC2 via Docker Hub

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
    # 1. Checkout code from the repository
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Login to Docker Hub using secrets stored in GitHub
    - name: Login to Docker Hub
      run: |
        echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    # 3. Build Docker image
    - name: Build image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/spotify-api:latest .

    # 4. Push to Docker Hub
    - name: Push image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/spotify-api:latest

    # 5. Deploy on EC2
    - name: Deploy on EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |

          echo "Logging into Docker Hub"
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

          echo "Pulling latest image"
          docker pull ${{ secrets.DOCKER_USERNAME }}/spotify-api:latest

          echo "Stopping old container"
          docker stop spotify-api-container || true
          docker rm spotify-api-container || true

          echo "Running new container"
          docker run -d \
            --name spotify-api-container \
            -p 8000:8000 \
            --env-file ~/app/.env \
            ${{ secrets.DOCKER_USERNAME }}/spotify-api:latest
